plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.dengzemiao.example"
    // compileSdk = flutter.compileSdkVersion
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.dengzemiao.example"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        // 指定支持的 CPU 架构
        ndk {
            // abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            // 为了避免将敏感信息（如密码）直接写入 build.gradle 文件中，建议将这些信息放到 gradle.properties 文件中。打开 android/gradle.properties 文件添加配置
            // 证书生成指令：看 my_project/cer/README.md 说明
            storeFile file(project.keyStoreFile)
            storePassword project.keyStorePassword
            keyAlias project.keyAlias
            keyPassword project.keyPassword
            // 输出查看值是否生效，cd 到 android 目录下执行 ./gradlew printProperties
            // println "KeyStore keyStoreFile: ${project.keyStoreFile}"
            // println "KeyStore keyStorePassword: ${project.keyStorePassword}"
            // println "KeyStore keyAlias: ${project.keyAlias}"
            // println "KeyStore keyPassword: ${project.keyPassword}"
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            // 方便测试可以使用调试签名
            // signingConfig = signingConfigs.debug
            // 正常需要使用正式签名
            signingConfig = signingConfigs.release
            // 启用代码混淆（ProGuard）
            minifyEnabled false
            // 启用资源压缩
            shrinkResources false
        }
    }
}

flutter {
    source = "../.."
}
